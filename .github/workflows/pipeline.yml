name: CI/CD Production Pipeline
on:
  push:
    branches: [main]

jobs:
  # JOB 1: KIỂM ĐỊNH CHẤT LƯỢNG (CI QUALITY GATE)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20] # Test song song trên Node 18 và 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{matrix.node}}'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint  
      - run: npm run build
      - run: npm test
      # Quét lỗ hổng bảo mật (Bắt buộc theo chuẩn Production)
      - run: npm audit --audit-level=high 

# JOB 2: ĐÓNG GÓI & ĐẨY LÊN KHO GHCR VỚI MÃ SHA CHUẨN
  build-push:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Repo Name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV    
          
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: TỰ ĐỘNG CẬP NHẬT MÃ SHA VÀO KHO GITOPS
  update-manifest:
    needs: [build-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'DaiNghia800/product-management-gitops' 
          token: ${{ secrets.GITOPS_TOKEN }}
          path: 'gitops-repo'
          ref: 'master'

      - name: Update Image Tag in values.yaml
        run: |
          cd gitops-repo
          # Dùng lệnh sed để tìm dòng tag: và thay bằng mã SHA hiện tại
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" product-api/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push origin master        

  notify:
    needs: [update-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deploy Successfull!
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Status: GitOps updated and rolling update is in progress on Kubernetes.       